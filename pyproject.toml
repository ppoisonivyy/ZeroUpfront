[project]
name = "zeroupfront-fixtures"
version = "0.1.0"
description = "Synthetic guarantee-of-payment test packets and optional OpenAI evaluation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2,<3",
    "pypdf>=5,<9",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4,<6",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
]
fixtures = ["reportlab>=4,<6"]
