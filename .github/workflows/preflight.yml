name: Research preflight
on: [push, pull_request]

permissions:
  contents: read

jobs:
  coordinator-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  synthetic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.7"
      - run: uv sync --locked --python 3.12
      - name: Locate PostgreSQL tools before running backend integration tests
        run: pg_config --bindir >> "$GITHUB_PATH"
      - run: initdb --version && pg_ctl --version
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python app/check_fixtures.py
      - run: uv run --locked python app/finance_eval.py
      - run: uv run --locked python app/eval_documents.py --require-complete
      - run: uv run --locked python app/eval_documents.py --samples ZeroUpfront-training-samples

      - name: Smoke test the coordinator API over loopback HTTP
        run: uv run --locked python bench/workspace_http.py --repetitions 2
      - name: Exercise same-case replacement and late worker completion
        run: uv run --locked --with 'psycopg[binary]==3.3.2' python bench/case_revision.py --repetitions 3
      - name: Check encounter, lease and export guards
        run: uv run --locked --with 'psycopg[binary]==3.3.2' python bench/case_revision_guards.py --repetitions 3
